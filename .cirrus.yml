centos_podman_task:
    podman_spawner_script:
       - ip add
       - cat /proc/net/dev
       - dnf -y install python3 python3-setuptools
       - python3 setup.py develop --user
       - python3 -m avocado --show=all run --test-runner=nrunner -- /bin/true
       - python3 -m avocado run --test-runner=nrunner -- /bin/true
       - dnf -y install podman
       - podman pull fedora:34
       - python3 -m avocado run --test-runner=nrunner --nrunner-spawner=podman --spawner-podman-image=fedora:34 --tap - -- /bin/true | grep 'ok 1 /bin/true'
    compute_engine_instance:
       image_project: centos-cloud
       image: centos-8-v20210609
       platform: linux

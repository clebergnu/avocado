fedora_podman_job_task:
    install_script:
       - python3 -c 'import setuptools' || dnf -y install python3 python3-setuptools
       - python3 setup.py develop --user
       - dnf -y install podman
       - PATH=~/.local/bin:$PATH python3 examples/jobs/exec_test_command.py
       - PATH=~/.local/bin:$PATH python3 examples/jobs/exec_test_command_podman.py
       - cat ~/avocado/job-results/latest/test-results/1*/stdout
       - grep Rawhide ~/avocado/job-results/latest/test-results/1*/stdout
    container:
      image: fedora:34
